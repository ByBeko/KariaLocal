name: KariaEjderha
version: 1.0.0
main: live.karia.ejderha.KariaEjderha
api-version: '1.21'
author: Karia
description: Karia'nın özgün ejderhaları (evcilleştirme, binme, uçma, üreme, element nefesi) ve Viking eşyaları. Java + Bedrock (Geyser).
softdepend: [floodgate, Geyser-Spigot]
loadbefore: [Multiverse-Core]
commands:
  ejder:
    description: Ejderhaların ve ejderha komutları
    aliases: [ejderham, dragons]
permissions:
  karia.ejder.admin:
    description: Ejderha yönetici komutları (ver, dogur, temizle, yenile)
    default: op
  karia.ejder.sinirsiz:
    description: Ejderha sayısı sınırını yok sayar
    default: op
